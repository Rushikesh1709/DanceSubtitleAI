{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Settings</h1>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Frame sampling (frames/second)</label>
      <input class="form-control" type="number" step="0.5" min="0.5" max="15" name="sampling_fps" value="{{ settings.sampling_fps }}"></div>
    <div class="col-md-4"><label class="form-label">Movement sensitivity (0.5–2)</label>
      <input class="form-control" type="number" step="0.1" min="0.5" max="2" name="sensitivity" value="{{ settings.sensitivity }}">
      <div class="form-text">Higher = small movements count as movement.</div></div>
    <div class="col-md-4"><label class="form-label">Pose model quality</label>
      <select class="form-select" name="model_complexity">
        {% for v, l in [(0, 'Fast (lite)'), (1, 'Balanced (full)'), (2, 'Accurate (heavy, slow)')] %}
        <option value="{{ v }}" {{ 'selected' if settings.model_complexity|int == v }}>{{ l }}</option>{% endfor %}
      </select></div>
    <div class="col-md-3"><label class="form-label">Minimum subtitle duration (s)</label>
      <input class="form-control" type="number" step="0.1" name="min_duration" value="{{ settings.min_duration }}"></div>
    <div class="col-md-3"><label class="form-label">Maximum subtitle duration (s)</label>
      <input class="form-control" type="number" step="0.1" name="max_duration" value="{{ settings.max_duration }}"></div>
    <div class="col-md-3"><label class="form-label">Minimum gap between subtitles (s)</label>
      <input class="form-control" type="number" step="0.05" name="min_gap" value="{{ settings.min_gap }}"></div>
    <div class="col-md-3"><label class="form-label">Confidence (reliability) threshold</label>
      <input class="form-control" type="number" step="0.05" min="0" max="1" name="confidence_threshold" value="{{ settings.confidence_threshold }}"></div>
    <div class="col-md-3"><label class="form-label">Max characters per line</label>
      <input class="form-control" type="number" name="max_chars_per_line" value="{{ settings.max_chars_per_line }}"></div>
    <div class="col-md-3"><label class="form-label">Max lines per subtitle</label>
      <input class="form-control" type="number" name="max_lines" value="{{ settings.max_lines }}"></div>
    <div class="col-md-3"><label class="form-label">Low-reliability intervals</label>
      <select class="form-select" name="low_confidence_mode">
        {% for v, l in [('neutral', 'Use a neutral sentence'), ('hide', 'Hide the subtitle'), ('show', 'Show with a warning')] %}
        <option value="{{ v }}" {{ 'selected' if settings.low_confidence_mode == v }}>{{ l }}</option>{% endfor %}
      </select></div>
    <div class="col-md-3"><label class="form-label">Main download format</label>
      <select class="form-select" name="output_format">
        <option value="srt" {{ 'selected' if settings.output_format == 'srt' }}>SRT</option>
        <option value="vtt" {{ 'selected' if settings.output_format == 'vtt' }}>WebVTT</option></select></div>
    <div class="col-12">
      <div class="form-check"><input class="form-check-input" type="checkbox" name="enable_hands" id="s1" value="1" {{ 'checked' if settings.enable_hands|string|lower in ('true','1') }}><label class="form-check-label" for="s1">Hand-shape analysis on by default</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="enable_face" id="s2" value="1" {{ 'checked' if settings.enable_face|string|lower in ('true','1') }}><label class="form-check-label" for="s2">Facial-expression estimates on by default</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="show_no_pose_subtitles" id="s3" value="1" {{ 'checked' if settings.show_no_pose_subtitles|string|lower in ('true','1') }}><label class="form-check-label" for="s3">Add a subtitle when the dancer is not visible</label></div>
      <div class="form-check"><input class="form-check-input" type="checkbox" name="show_mudra_candidates" id="s4" value="1" {{ 'checked' if settings.show_mudra_candidates|string|lower in ('true','1') }}><label class="form-check-label" for="s4">Mention possible (unverified) mudra resemblances in subtitles</label></div>
    </div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Save settings</button></div>
  </div>
</form>
<p class="small text-muted mt-2">Analysis settings apply to videos processed after saving. Subtitle line length and download format also apply to downloads of existing jobs.</p>
{% endblock %}
